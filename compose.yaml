services:
  editor:
    build:
      context: .
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${EDITOR_PORT:-4173}:4173"
    environment:
      CODESTRA_GATEWAY_ORIGIN: ${CODESTRA_GATEWAY_ORIGIN:-}
      KEYCLOAK_ORIGIN: ${VITE_KEYCLOAK_URL:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
